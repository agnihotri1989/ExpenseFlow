  <text x="36" y="136" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Type</text>
  <circle cx="48" cy="162" r="8" fill="#FFFFFF" stroke="#F43F5E" stroke-width="2"/>
  <circle cx="48" cy="162" r="4" fill="#F43F5E"/>
  <text x="64" y="166" fill="#F43F5E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Expense</text>

