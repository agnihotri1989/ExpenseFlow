  <text x="36" y="202" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Amount ($)</text>
  <rect x="36" y="212" width="308" height="46" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
