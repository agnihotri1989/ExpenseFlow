  <circle cx="330" cy="22" r="3" fill="#FFFFFF"/>
  <rect x="340" y="16" width="18" height="10" rx="3" fill="#FFFFFF" opacity="0.8"/>

  <!-- Header Toolbar (Java Activity) -->
  <rect x="6" y="40" width="368" height="54" fill="#0F172A"/>
  <text x="24" y="73" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">←</text>
  <text x="54" y="73" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Add Transaction</text>
  
  <rect x="272" y="55" width="86" height="24" rx="6" fill="#D1FAE5"/>
  <text x="315" y="71" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Java + XML</text>

  <!-- Form Container Card -->
  <rect x="18" y="106" width="344" height="630" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

