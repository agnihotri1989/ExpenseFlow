  <!-- Category Spinner -->
  <text x="36" y="358" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Category</text>
  <rect x="36" y="368" width="308" height="46" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="50" y="396" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Food &amp; Dining</text>
  <text x="324" y="396" fill="#64748B" font-size="12">▼</text>

  <!-- Payment Method Spinner -->
  <text x="36" y="436" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Payment Method</text>
  <rect x="36" y="446" width="308" height="46" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="50" y="474" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Credit Card</text>
  <text x="324" y="474" fill="#64748B" font-size="12">▼</text>

  <!-- Date Picker Row -->
  <text x="36" y="514" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Date</text>
  <rect x="36" y="524" width="308" height="46" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="50" y="552" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Oct 02, 2026</text>
  <text x="320" y="552" font-size="16">📅</text>

