  <text x="36" y="592" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Notes (Optional)</text>
  <rect x="36" y="602" width="308" height="54" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="50" y="626" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Celebrated project milestone with team</text>

  <!-- Submit Button -->
  <rect x="36" y="674" width="308" height="48" rx="12" fill="#10B981"/>
  <text x="190" y="704" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Save Transaction</text>
